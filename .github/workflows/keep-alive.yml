name: Keep Alive Render Services

on:
  schedule:
    # Runs every 10 minutes to prevent Render's sleep mode (limit is 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows running manually from the Actions tab

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: 🏓 Waking up mAIo Frontend
        continue-on-error: true # Prevents marking the Action as failed if it times out
        run: |
          echo "Sending ping to https://maio.maioli.dev.br..."
          curl -sL https://maio.maioli.dev.br > /dev/null
          echo "Frontend pinged successfully."

      - name: 🏓 Waking up mAIo API
        continue-on-error: true
        run: |
          echo "Sending ping to https://api.maioli.dev.br..."
          curl -sL https://api.maioli.dev.br > /dev/null
          echo "Backend pinged successfully."
